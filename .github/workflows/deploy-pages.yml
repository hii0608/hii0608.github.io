name: Deploy Pages

# Works whether Pages "Source" is set to GitHub Actions (this workflow deploys)
# or Deploy-from-a-branch (the site also lives at the repo root, so the classic
# builder serves it directly). Runs on push and on demand.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'projects/**'
      - 'data/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r projects _site/
          cp -r data _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
